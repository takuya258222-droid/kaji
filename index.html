<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家事</title>
<meta name="description" content="彼女と共有する家事アプリ。やった人を1タップで記録して、分担を見える化。">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#2f7d5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家事">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="app-header">
  <div>
    <h1>家事</h1>
    <p id="todayLabel" class="today-label"></p>
  </div>
  <div id="syncStatus" class="sync-status" title="同期状態" aria-live="polite">読み込み中…</div>
</header>

<div id="apiNotice" class="notice hidden">API未設定です。Apps ScriptのURLを設定すると保存・同期が有効になります。</div>
<div id="errorBar" class="error-bar hidden" role="alert"></div>
<div id="undoBar" class="undo-bar hidden"><span id="undoText"></span><button id="undoButton" type="button">元に戻す</button></div>

<nav class="tabs" id="tabs" role="tablist" aria-label="表示切り替え">
  <button type="button" data-tab="today" class="tab active" role="tab" aria-selected="true">今日</button>
  <button type="button" data-tab="history" class="tab" role="tab" aria-selected="false">履歴</button>
</nav>

<main>
  <div id="loadingState" class="card loading-card" role="status">
    <span id="loadingText">読み込み中…</span>
    <button id="retryLoadButton" class="plain-btn hidden" type="button">再読み込み</button>
  </div>
  <!-- 今日（今日やること・家事一覧・今日やった家事・分担を1画面に） -->
  <section id="view-today" class="view">
    <div class="card target-card">
      <h2>今日やること</h2>
      <div id="target-daily"></div>
    </div>

    <div class="card">
      <h2>家事一覧</h2>
      <p class="list-note">今日やる家事は、一覧の「＋ 選ぶ」を押すと上の「今日やること」に入ります。</p>
      <label class="list-search-label" for="listSearch">家事を検索</label>
      <input id="listSearch" class="list-search" type="search" placeholder="例：トイレ、洗濯、ゴミ" autocomplete="off">
      <div class="list-chips" role="group" aria-label="項目で絞り込む">
        <button type="button" class="chip list-chip on" data-cat="all" aria-pressed="true">すべて</button>
        <button type="button" class="chip list-chip" data-cat="kitchen" aria-pressed="false">キッチン</button>
        <button type="button" class="chip list-chip" data-cat="water" aria-pressed="false">水回り</button>
        <button type="button" class="chip list-chip" data-cat="laundry" aria-pressed="false">洗濯</button>
        <button type="button" class="chip list-chip" data-cat="living" aria-pressed="false">リビング・部屋</button>
        <button type="button" class="chip list-chip" data-cat="other" aria-pressed="false">ゴミ・その他</button>
      </div>
    </div>
    <div id="choreList"></div>

    <div class="card">
      <h2>今日やった家事</h2>
      <div id="todayDoneBody"></div>
    </div>

    <div class="card" id="shareCard">
      <h2>今月の分担</h2>
      <div id="shareBody"></div>
    </div>
  </section>

  <!-- 履歴 -->
  <section id="view-history" class="view hidden">
    <div class="card">
      <div class="cal-head">
        <button type="button" id="calPrev" aria-label="前月を表示">‹ 前月</button>
        <h2 id="calTitle"></h2>
        <button type="button" id="calNext" aria-label="翌月を表示">翌月 ›</button>
      </div>
      <div id="monthShare"></div>
      <div class="cal-week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div id="calendar" class="cal-grid"></div>
    </div>
    <div class="card">
      <h2 id="dayDetailTitle">日を選んでください</h2>
      <div id="dayDetail"></div>
    </div>
  </section>
</main>

<footer class="app-footer">家事アプリ <span id="appVersion">v1.4</span>｜記録は自動で保存され、あやと同期されます。</footer>

<script src="./app.js"></script>
</body>
</html>
